name: Build & Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/DynamicIsland.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore -r win-x64

      - name: Build Release
        run: dotnet build -c Release -r win-x64 --no-restore -p:WarningsAsErrors=CS8600%3BCS8602%3BCS8603

      - name: Validate Release & WinGet Manifests
        shell: pwsh
        run: ./scripts/SyncVersion.ps1 -VerifyOnly

      - name: Run Deterministic Self-Test Suite
        shell: pwsh
        run: |
          dotnet run -c Release -r win-x64 --no-build -- --self-test --self-test-report=self-test-report.txt
          if (Test-Path self-test-report.txt) {
            Get-Content self-test-report.txt
            Remove-Item self-test-report.txt -Force
          }

      - name: Startup & Memory Diagnostic Smoke Check
        run: dotnet run -c Release -r win-x64 --no-build -- --diagnose-startup

      - name: Publish Single-File Release
        run: dotnet publish DynamicIsland.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish/

      - name: Verify Published Single-File Binary
        shell: pwsh
        run: ./publish/DynamicIsland.exe --self-test
