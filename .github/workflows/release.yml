name: Release & Publish Update

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.9.0)'
        required: false
        default: 'v0.9.0'

permissions:
  contents: write

jobs:
  release:
    name: Build, Verify & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract Tag & Version
        id: version_step
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.tag }}" -ne "") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $cleanVersion = $tag.TrimStart('v','V')
          $isBeta = $tag.Contains("-beta") -or $tag.Contains("-rc") -or $tag.Contains("-alpha")
          $channel = if ($isBeta) { "beta" } else { "stable" }
          
          Write-Host "Tag: $tag, Version: $cleanVersion, Channel: $channel"
          echo "TAG=$tag" >> $env:GITHUB_ENV
          echo "VERSION=$cleanVersion" >> $env:GITHUB_ENV
          echo "CHANNEL=$channel" >> $env:GITHUB_ENV
          echo "IS_PRERELEASE=$isBeta" >> $env:GITHUB_ENV

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          $innoDir = if (Test-Path "C:\Program Files (x86)\Inno Setup 6") { "C:\Program Files (x86)\Inno Setup 6" } else { "C:\Program Files\Inno Setup 6" }
          Write-Host "Inno Setup directory: $innoDir"
          echo "$innoDir" >> $env:GITHUB_PATH

      - name: Restore dependencies
        run: dotnet restore -r win-x64

      - name: Build Release
        run: dotnet build -c Release -r win-x64 --no-restore -p:Version=${{ env.VERSION }}

      - name: Run Deterministic Self-Test Suite
        run: dotnet run -c Release -r win-x64 --no-build -- --self-test

      - name: Publish Single-File Native Binary (win-x64)
        run: |
          dotnet publish DynamicIsland.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:Version=${{ env.VERSION }} -o publish/

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc -or -not (Test-Path $iscc)) {
            if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
              $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
            }
          }
          Write-Host "Using Inno Setup compiler: $iscc"
          if (-not $iscc -or -not (Test-Path $iscc)) {
            Write-Error "ISCC.exe (Inno Setup compiler) was not found. Aborting release build instead of shipping an uncompiled installer."
            exit 1
          }
          New-Item -ItemType Directory -Path publish\installer -Force
          & $iscc /DMyAppVersion="${{ env.VERSION }}" installer/DynamicIsland.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup compilation failed with exit code $LASTEXITCODE."
            exit $LASTEXITCODE
          }
          
          # Standardize installer naming: ensure publish\installer\DynamicIsland-Setup.exe exists
          $innoOut = "publish\installer\DynamicIsland-Setup-Inno.exe"
          $stdOut = "publish\installer\DynamicIsland-Setup.exe"
          if (Test-Path $innoOut) {
            Move-Item -Path $innoOut -Destination $stdOut -Force
          } elseif (-not (Test-Path $stdOut)) {
            Write-Error "Expected Inno Setup installer output was not produced at '$innoOut' or '$stdOut'."
            exit 1
          }

      - name: Package Portable Distribution ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path publish/DynamicIsland.exe, installer/app.ico, AllowPhoneBridgeFirewall.bat -DestinationPath publish/DynamicIsland-Portable.zip -Force

      - name: Compute Cryptographic Hashes & Generate release-manifest.json
        id: manifest_step
        shell: pwsh
        run: |
          $setupExe = "publish\installer\DynamicIsland-Setup.exe"
          $portableZip = "publish\DynamicIsland-Portable.zip"
          $singleExe = "publish\DynamicIsland.exe"

          $setupHash = (Get-FileHash -Path $setupExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupSize = (Get-Item $setupExe).Length

          $portableHash = (Get-FileHash -Path $portableZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $portableSize = (Get-Item $portableZip).Length

          $singleHash = (Get-FileHash -Path $singleExe -Algorithm SHA256).Hash.ToLowerInvariant()

          # Output checksums.sha256 file
          $checksumsContent = "$setupHash  DynamicIsland-Setup.exe`n$portableHash  DynamicIsland-Portable.zip`n$singleHash  DynamicIsland.exe"
          Set-Content -Path "publish/checksums.sha256" -Value $checksumsContent -Encoding utf8

          # Build Canonical release-manifest.json
          $manifest = [ordered]@{
            version = "${{ env.VERSION }}"
            releaseTag = "${{ env.TAG }}"
            channel = "${{ env.CHANNEL }}"
            releaseDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            minWindowsBuild = "10.0.19041.0"
            changelogUrl = "https://github.com/${{ github.repository }}/releases/tag/${{ env.TAG }}"
            summary = "Dynamic Island ${{ env.TAG }} release for Windows 10/11."
            isCritical = $false
            downloads = [ordered]@{
              installer = [ordered]@{
                url = "https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/DynamicIsland-Setup.exe"
                sha256 = $setupHash
                sizeBytes = $setupSize
              }
              portable = [ordered]@{
                url = "https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/DynamicIsland-Portable.zip"
                sha256 = $portableHash
                sizeBytes = $portableSize
              }
            }
          }

          $manifestJson = $manifest | ConvertTo-Json -Depth 5
          Set-Content -Path "publish/release-manifest.json" -Value $manifestJson -Encoding utf8
          Set-Content -Path "release-manifest.json" -Value $manifestJson -Encoding utf8
          Write-Host "Generated release-manifest.json:"
          Write-Host $manifestJson

      - name: Publish GitHub Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/installer/DynamicIsland-Setup.exe
            publish/DynamicIsland-Portable.zip
            publish/DynamicIsland.exe
            publish/release-manifest.json
            publish/checksums.sha256
          prerelease: ${{ env.IS_PRERELEASE == 'True' }}
          generate_release_notes: true
          tag_name: ${{ env.TAG }}
          name: Dynamic Island ${{ env.TAG }}

      - name: Commit Updated release-manifest.json to main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          Copy-Item -Path "publish/release-manifest.json" -Destination "release-manifest.json" -Force
          ./scripts/SyncVersion.ps1 -Version "${{ env.VERSION }}"
          git add DynamicIsland.csproj release-manifest.json installer/winget/*.yaml website/index.html
          $status = git status --porcelain DynamicIsland.csproj release-manifest.json installer/winget/ website/index.html
          if ($status) {
            git commit -m "chore(release): Sync version & release-manifest.json for ${{ env.TAG }} [skip ci]"
            git push origin main
          } else {
            Write-Host "Version & release-manifest.json already up to date."
          }
